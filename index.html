<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome, Chelsea Kong</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&family=Noto+Serif+HK:wght@200..900&display=swap');
    </style>
    <style>
        :root {
            --sage-green: #9caf88;
            --soft-white: #fdfcf8;
            --bark-brown: #5d544b;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--soft-white);
            color: var(--bark-brown);
            font-family: "Noto Serif HK", serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 600px;
            z-index: 1;
        }

        .header {
            margin-bottom: 50px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        .english-name {
            font-size: 1.2rem;
            color: var(--sage-green);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 300;
        }

        .poem-container {
            position: relative;
            padding: 40px;
            border: 1px solid rgba(156, 175, 136, 0.3);
            background-color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
        }

        .poem-line {
            font-family: "LXGW WenKai TC", cursive;
            font-size: 1.8rem;
            line-height: 2.5;
            margin: 10px 0;
            display: block;
        }

        /* Decorative Leaf Element */
        .leaf {
            color: var(--sage-green);
            font-size: 2rem;
            margin-bottom: 20px;
            opacity: 0.7;
        }

        footer {
            margin-top: 50px;
            font-size: 0.9rem;
            opacity: 0.6;
        }

        /* Background Decoration */
        .bg-circle {
            position: fixed;
            top: -10%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: #e9f0e4;
            border-radius: 50%;
            z-index: -1;
        }

        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            .poem-line { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div class="bg-circle"></div>

    <div class="container">
        <div class="header">
            <div class="leaf">🌿</div>
            <div class="english-name">Chelsea Kong, Kiu</div>
        </div>

        <div class="poem-container">
            <span class="poem-line">像一棵卓然生長的樹</span>
            <span class="poem-line">翹起枝葉向天伸</span>
            <span class="poem-line">不與花朵爭嬌豔</span>
            <span class="poem-line">只為成為自己的森林</span>
        </div>

        <footer>
            With love, welcome to the world.
        </footer>
    </div>

</body>
</html>
